name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14.2
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.14.2

      - name: Install dependencies
        run: uv sync --all-groups

  ruff:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14.2
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.14.2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: |
          uv run ruff check .

  ty:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14.2
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.14.2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ty
        run: |
          uv run ty check --output-format github

  hacs:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14.2
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.14.2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run HACS
        uses: "hacs/action@main"
        with:
          category: "integration"

  hassfest:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
